name: Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to release from
        required: false
        type: string
        default: main
      version:
        description: >-
          Release spec. `rc` (the default) publishes the next `1.0.0-rc.N`;
          `rc.N` publishes that exact candidate. `beta[.N]` and `alpha[.N]`
          select those prerelease channels. `patch|minor|major` or `x.y.z`
          publishes a stable release. Anything else publishes `0.0.0-<name>`.
        required: false
        type: string
        default: "rc"
      force-latest:
        description: Publish under the latest dist-tag
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ inputs.branch }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  ALCHEMY_REPO: alchemy-run/distilled

jobs:
  build:
    name: Build and pack
    runs-on: blacksmith-8vcpu-ubuntu-2404
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ALCHEMY_VERSION_BOT_ID }}
          private-key: ${{ secrets.ALCHEMY_VERSION_BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          token: ${{ steps.bot-token.outputs.token }}

      - name: Setup pnpm & Bun
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true
          install: false

      - name: Install Node 24
        run: pnpm runtime set node 24 -g

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - id: release
        name: Prepare release
        env:
          FORCE_LATEST: ${{ inputs.force-latest }}
        run: |
          set -euo pipefail
          bun scripts/release/prepare.ts '${{ inputs.version }}' | tee -a "$GITHUB_OUTPUT"

      - name: Typecheck and build all packages
        run: pnpm typecheck:ci

      - name: Pack release artifacts
        run: |
          set -euo pipefail
          mkdir release-packages
          while IFS= read -r dir; do
            pnpm --dir "$dir" pack --pack-destination "$GITHUB_WORKSPACE/release-packages"
          done < <(jq -r '.[]' release-package-dirs.json)

      - id: commit
        name: Commit and tag
        env:
          VERSION: ${{ steps.release.outputs.version }}
          CHANNEL: ${{ steps.release.outputs.channel }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          git config user.email "alchemy-version-bot[bot]@users.noreply.github.com"
          git config user.name "alchemy-version-bot[bot]"
          if [[ "$CHANNEL" != "tag" ]]; then bun scripts/release/release-notes.ts "$TAG"; fi
          mapfile -t PACKAGE_JSONS < <(jq -r '.[] | "\(.)/package.json"' release-package-dirs.json)
          git add "${PACKAGE_JSONS[@]}" pnpm-lock.yaml
          if [[ "$CHANNEL" != "tag" ]]; then git add CHANGELOG.md; fi
          if ! git diff --cached --quiet; then git commit -m "chore(release): ${VERSION}"; fi
          if ! git rev-parse --verify "refs/tags/${TAG}" >/dev/null 2>&1; then git tag -a "$TAG" -m "Release ${TAG}"; fi
          git push origin HEAD
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then git push origin "refs/tags/${TAG}"; fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-packages
          path: release-packages/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 0

      - name: Setup pnpm & Bun
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true
          install: false

      - name: Install Node 24
        run: pnpm runtime set node 24 -g

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - run: sed -i '/always-auth/d' ~/.npmrc 2>/dev/null || true

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-packages
          path: release-packages

      - name: Publish tarballs with OIDC
        env:
          PUBLISH_TAG: ${{ needs.build.outputs.tag }}
          CHANNEL_TAG: ${{ needs.build.outputs.channel == 'release' && 'latest' || needs.build.outputs.channel == 'tag' && needs.build.outputs.tag || 'next' }}
          FORCE_LATEST: ${{ inputs.force-latest }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bash scripts/release/publish.sh

      - name: Create GitHub release
        if: needs.build.outputs.channel != 'tag'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: bun scripts/release/github-release.ts "v${VERSION}" "$CHANNEL"

      - name: Notify Discord
        if: needs.build.outputs.channel != 'tag'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ needs.build.outputs.version }}
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: bun scripts/release/discord-notify.ts "v${VERSION}" "$CHANNEL"
